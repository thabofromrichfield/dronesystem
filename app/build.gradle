// GHOSTGRID UAV — application module
// Two flavours, deliberately split so the interface can be previewed anywhere:
//
//   full  → real DJI Mobile SDK 4.18. Flies an aircraft. ARM only.
//   sim   → no DJI dependency at all. Runs on an x86_64 emulator at full speed
//           and drives the whole HUD from synthetic telemetry.
//
// Build them separately:
//   ./gradlew assembleFullDebug     → app/build/outputs/apk/full/debug/
//   ./gradlew installSimDebug       → straight onto a running emulator

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

repositories {
    mavenLocal()
}

android {
    compileSdkVersion 33
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "drone.test"
        minSdkVersion 23
        targetSdkVersion 33
        multiDexEnabled true
        versionCode 1
        versionName "0.1.0"
        vectorDrawables.useSupportLibrary = true
    }

    flavorDimensions "backend"

    productFlavors {
        full {
            dimension "backend"
            // DJI ships 32/64-bit ARM native libs only. No x86 build exists.
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        sim {
            dimension "backend"
            applicationIdSuffix ".sim"
            versionNameSuffix "-sim"
            // No DJI libraries are linked in this flavour, so the emulator's
            // native ABIs are available and the AVD runs unemulated.
            ndk { abiFilters 'x86_64', 'x86' }
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    // Do NOT strip DJI native libraries. Stripping them crashes the SDK at load time.
    // Harmless no-ops in the sim flavour, which links none of these.
    packagingOptions {
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'assets/location_map_gps_locked.png'
        exclude 'assets/location_map_gps_3d.png'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // --- DJI Mobile SDK V4 — full flavour ONLY -----------------------------
    // The sim flavour never sees these, which is what lets it run on x86_64.
    fullImplementation('com.dji:dji-sdk:4.18') {
        // Anti-distortion is only needed for Mavic 2 Pro/Zoom dual-camera work.
        exclude module: 'library-anti-distortion'
    }
    fullCompileOnly 'com.dji:dji-sdk-provided:4.18'

    // --- AndroidX ----------------------------------------------------------
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation "androidx.core:core-ktx:$androidXCore"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.annotation:annotation:1.2.0'

    // --- Kotlin ------------------------------------------------------------
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.9'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
}

// Fail loudly before a 15-minute build if the DJI App Key is still the
// placeholder. Only guards the full flavour — sim needs no key.
gradle.taskGraph.whenReady { graph ->
    def wantsFull = graph.allTasks.any { it.name.toLowerCase().contains('full') }
    if (!wantsFull) return
    // CI passes -PallowPlaceholderKey=true to compile-check the flight code
    // without a key. The resulting APK will not register with DJI.
    if (project.hasProperty('allowPlaceholderKey')) return
    def res = file('src/main/res/values/strings.xml')
    if (!res.exists()) return
    if (res.text.contains('PASTE_YOUR_DJI_APP_KEY_HERE')) {
        throw new GradleException(
            "DJI App Key is still the placeholder.\n" +
            "  Register at https://account.dji.com/register?appId=71#/developer\n" +
            "  with package name: drone.test\n" +
            "  then paste it into app/src/main/res/values/strings.xml, line 11.\n" +
            "  Building the sim flavour instead needs no key: ./gradlew installSimDebug"
        )
    }
}
